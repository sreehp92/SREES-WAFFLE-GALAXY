<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sree's Waffle Galaxy - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f4e8;color:#3d2b21;font-family:Arial,sans-serif}
header{background:#3d2b21;color:white;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold;background:#3d2b21;color:white}
.logout{background:#dc9b9b;color:#3d2b21}
main{max-width:1100px;margin:30px auto;padding:0 18px}
.card{background:#fffdf8;border-radius:18px;padding:25px;margin-bottom:20px;box-shadow:0 8px 30px rgba(61,43,33,.1)}
h2{margin-top:0}
label{display:block;margin:12px 0 6px;font-weight:bold;font-size:14px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}
textarea{min-height:120px;resize:vertical}
button{margin-top:8px}
.message{padding:12px;background:#e5eee4;border-radius:10px;margin-bottom:20px}
#contentMessage,#menuMessage,#galleryMessage{font-weight:bold}
pre{white-space:pre-wrap;word-break:break-word;background:#f6f4e8;padding:15px;border-radius:10px}
hr{border:0;border-top:1px solid #ddd;margin:20px 0}
</style>

</head>

<body>

<header>
<h1>Sree's Waffle Galaxy — Admin</h1>
<button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<div id="message" class="message">Loading...</div>

<!-- SITE CONTENT -->

<div class="card">
<h2>Site Content</h2>

<label for="contentTitle">Section</label> <input id="contentTitle" type="text" placeholder="Example: About">

<label for="contentText">Content</label>

<textarea id="contentText" placeholder="Enter website content"></textarea>

<button onclick="saveSiteContent()">Save Site Content</button>

<p id="contentMessage"></p>

<hr>

<pre id="siteContent">Loading...</pre>

</div>

<!-- MENU ITEMS -->

<div class="card">
<h2>Menu Items</h2>

<label for="menuName">Name</label> <input id="menuName" type="text" placeholder="Example: Chocolate Waffle">

<label for="menuPrice">Price</label> <input id="menuPrice" type="number" placeholder="Example: 149">

<label for="menuDescription">Description</label>

<textarea id="menuDescription" placeholder="Enter menu item description"></textarea>

<button onclick="saveMenuItem()">Save Menu Item</button>

<p id="menuMessage"></p>

<hr>

<pre id="menuItems">Loading...</pre>

</div>

<!-- GALLERY -->

<div class="card">
<h2>Gallery</h2>

<label for="galleryImage">Image URL</label> <input id="galleryImage" type="text" placeholder="https://example.com/image.jpg">

<label for="galleryTitle">Title</label> <input id="galleryTitle" type="text" placeholder="Example: Chocolate Waffle">

<button onclick="saveGallery()">Save Gallery Image</button>

<p id="galleryMessage"></p>

<hr>

<pre id="gallery">Loading...</pre>

</div>

<!-- REVIEWS -->

<div class="card">
<h2>Reviews</h2>
<pre id="reviews">Loading...</pre>
</div>

<!-- ENQUIRIES -->

<div class="card">
<h2>Enquiries</h2>
<pre id="enquiries">Loading...</pre>
</div>

</main>

<script>

const SUPABASE_URL="https://vxcbpbcqiqwgiapgvoxy.supabase.co";
const SUPABASE_KEY="sb_publishable_sSh0vTRY28VnBKP8Zunosg_07RmB9BJ";

const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);


async function checkLogin(){

  const {data:{user}}=await db.auth.getUser();

  if(!user){
    window.location.href="admin.html";
    return;
  }

  document.getElementById("message").textContent=
    "Logged in as "+user.email;

  loadData();
}


async function loadData(){

  const site=await db
    .from("site_content")
    .select("*");

  document.getElementById("siteContent").textContent=
    JSON.stringify(site.data||[],null,2);


  const menu=await db
    .from("menu_items")
    .select("*");

  document.getElementById("menuItems").textContent=
    JSON.stringify(menu.data||[],null,2);


  const gallery=await db
    .from("gallery")
    .select("*");

  document.getElementById("gallery").textContent=
    JSON.stringify(gallery.data||[],null,2);


  const reviews=await db
    .from("reviews")
    .select("*");

  document.getElementById("reviews").textContent=
    JSON.stringify(reviews.data||[],null,2);


  const enquiries=await db
    .from("enquiries")
    .select("*");

  document.getElementById("enquiries").textContent=
    JSON.stringify(enquiries.data||[],null,2);
}


async function saveSiteContent(){

  const section=
    document.getElementById("contentTitle").value.trim();

  const text=
    document.getElementById("contentText").value.trim();

  const message=
    document.getElementById("contentMessage");


  if(!section || !text){

    message.textContent=
      "Please enter both section and content.";

    return;
  }


  message.textContent="Saving...";


  const {error}=await db
    .from("site_content")
    .insert({
      section:section,
      content:{text:text}
    });


  if(error){

    message.textContent=
      "Error: "+error.message;

    return;
  }


  message.textContent=
    "Site content saved successfully!";


  document.getElementById("contentTitle").value="";
  document.getElementById("contentText").value="";


  loadData();
}


async function saveMenuItem(){

  const name=
    document.getElementById("menuName").value.trim();

  const price=
    document.getElementById("menuPrice").value;

  const description=
    document.getElementById("menuDescription").value.trim();

  const message=
    document.getElementById("menuMessage");


  if(!name || !price){

    message.textContent=
      "Please enter name and price.";

    return;
  }


  message.textContent="Saving...";


  const {error}=await db
    .from("menu_items")
    .insert({
      name:name,
      price:Number(price),
      description:description
    });


  if(error){

    message.textContent=
      "Error: "+error.message;

    return;
  }


  message.textContent=
    "Menu item saved successfully!";


  document.getElementById("menuName").value="";
  document.getElementById("menuPrice").value="";
  document.getElementById("menuDescription").value="";


  loadData();
}


async function saveGallery(){

  const imageUrl=
    document.getElementById("galleryImage").value.trim();

  const title=
    document.getElementById("galleryTitle").value.trim();

  const message=
    document.getElementById("galleryMessage");


  if(!imageUrl){

    message.textContent=
      "Please enter an image URL.";

    return;
  }


  message.textContent="Saving...";


  const {error}=await db
    .from("gallery")
    .insert({
      title:title,
      image_url:imageUrl,
      display_order:0,
      is_active:true
    });


  if(error){

    message.textContent=
      "Error: "+error.message;

    return;
  }


  message.textContent=
    "Gallery image saved successfully!";


  document.getElementById("galleryImage").value="";
  document.getElementById("galleryTitle").value="";


  loadData();
}


async function logout(){

  await db.auth.signOut();

  window.location.href="admin.html";
}


checkLogin();

</script>

</body>
</html>
