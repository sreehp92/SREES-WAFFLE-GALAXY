<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sree's Waffle Galaxy - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f4e8;
  color:#3d2b21;
  font-family:Arial,sans-serif
}

header{
  background:#3d2b21;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

header h1{
  margin:0;
  font-size:20px
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
  background:#3d2b21;
  color:white;
  margin-top:8px
}

.logout{
  background:#dc9b9b;
  color:#3d2b21
}

main{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px
}

.card{
  background:#fffdf8;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(61,43,33,.1)
}

h2{
  margin-top:0
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  font-size:14px
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit
}

textarea{
  min-height:120px;
  resize:vertical
}

.message{
  padding:12px;
  background:#e5eee4;
  border-radius:10px;
  margin-bottom:20px;
  font-weight:bold
}

.success{
  color:#287a3d;
  font-weight:bold
}

.error{
  color:#b3261e;
  font-weight:bold
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#f6f4e8;
  padding:15px;
  border-radius:10px
}

hr{
  border:0;
  border-top:1px solid #ddd;
  margin:20px 0
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
  vertical-align:top;
  font-size:14px
}

th{
  background:#f6f4e8;
  font-weight:bold
}
</style>

</head>

<body>

<header>
  <h1>Sree's Waffle Galaxy — Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<main>

<div id="message" class="message">Loading...</div>

<!-- SITE CONTENT -->

<div class="card">

<h2>Site Content</h2>

<label for="contentTitle">Section</label>

<input
id="contentTitle"
type="text"
placeholder="Example: About">

<label for="contentText">Content</label>

<textarea
  id="contentText"
  placeholder="Enter website content"></textarea>

<button onclick="saveSiteContent()">
  Save Site Content
</button>

<p id="contentMessage"></p>

<hr>

<pre id="siteContent">Loading...</pre>

</div>

<!-- MENU ITEMS -->

<div class="card">

<h2>Menu Items</h2>

<label for="menuName">Name</label>

<input
id="menuName"
type="text"
placeholder="Example: Chocolate Waffle">

<label for="menuPrice">Price</label>

<input
id="menuPrice"
type="number"
placeholder="Example: 149">

<label for="menuDescription">Description</label>

<textarea
  id="menuDescription"
  placeholder="Enter menu item description"></textarea>

<button onclick="saveMenuItem()">
  Save Menu Item
</button>

<p id="menuMessage"></p>

<hr>

<pre id="menuItems">Loading...</pre>

</div>

<!-- GALLERY -->

<div class="card">

<h2>Gallery</h2>

<label for="galleryImage">
  Image URL
</label>

<input
id="galleryImage"
type="text"
placeholder="https://example.com/image.jpg">

<label for="galleryTitle">
  Title
</label>

<input
id="galleryTitle"
type="text"
placeholder="Example: Chocolate Waffle">

<button onclick="saveGallery()">
  Save Gallery Image
</button>

<p id="galleryMessage"></p>

<hr>

<pre id="gallery">Loading...</pre>

</div>

<!-- REVIEWS -->

<div class="card">

<h2>Reviews</h2>

<label for="customerName">
  Customer Name
</label>

<input
id="customerName"
type="text"
placeholder="Example: Rahul">

<label for="reviewText">
  Review
</label>

<textarea
  id="reviewText"
  placeholder="Enter customer review"></textarea>

<label for="reviewRating">
  Rating
</label>

<select id="reviewRating">
  <option value="">Select rating</option>
  <option value="5">5 Stars</option>
  <option value="4">4 Stars</option>
  <option value="3">3 Stars</option>
  <option value="2">2 Stars</option>
  <option value="1">1 Star</option>
</select>

<button onclick="saveReview()">
  Save Review
</button>

<p id="reviewMessage"></p>

<hr>

<pre id="reviews">Loading...</pre>

</div>

<!-- ENQUIRIES -->

<div class="card">

<h2>Enquiries</h2>

<div style="overflow-x:auto;">

<table id="enquiriesTable">

<thead>

<tr>
  <th>Name</th>
  <th>Phone</th>
  <th>Email</th>
  <th>Location</th>
  <th>Message</th>
  <th>Status</th>
  <th>Date</th>
  <th>Actions</th>
</tr>

</thead>

<tbody id="enquiries">

<tr>
  <td colspan="8">Loading...</td>
</tr>

</tbody>

</table>

</div>

</div>

</main>

<script>


/* SUPABASE */

const SUPABASE_URL =
"https://vxcbpbcqiqwgiapgvoxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_sSh0vTRY28VnBKP8Zunosg_07RmB9BJ";

const {createClient} = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* LOGIN CHECK */

async function checkLogin(){

  const {
    data:{user}
  } = await db.auth.getUser();

  if(!user){

    window.location.href="admin.html";

    return;
  }

  document.getElementById("message").textContent =
    "Logged in as " + user.email;

  loadData();
}


/* LOAD ALL DATA */

async function loadData(){


  /* SITE CONTENT */

  const site = await db
    .from("site_content")
    .select("*")
    .order("id",{ascending:true});

  document.getElementById("siteContent").textContent =
    JSON.stringify(
      site.data || [],
      null,
      2
    );


  /* MENU */

  const menu = await db
    .from("menu_items")
    .select("*")
    .order("id",{ascending:true});

  document.getElementById("menuItems").textContent =
    JSON.stringify(
      menu.data || [],
      null,
      2
    );


  /* GALLERY */

  const gallery = await db
    .from("gallery")
    .select("*")
    .order("id",{ascending:true});

  document.getElementById("gallery").textContent =
    JSON.stringify(
      gallery.data || [],
      null,
      2
    );


  /* REVIEWS */

  const reviews = await db
    .from("reviews")
    .select("*")
    .order("id",{ascending:true});

  document.getElementById("reviews").textContent =
    JSON.stringify(
      reviews.data || [],
      null,
      2
    );


  /* ENQUIRIES */

  const enquiries = await db
    .from("enquiries")
    .select("*")
    .order("id",{ascending:false});


  const tbody =
    document.getElementById("enquiries");


  if(enquiries.error){

    tbody.innerHTML = `
      <tr>
        <td colspan="8">
          Error loading enquiries:
          ${escapeHTML(enquiries.error.message)}
        </td>
      </tr>
    `;

    return;
  }


  if(
    !enquiries.data ||
    enquiries.data.length === 0
  ){

    tbody.innerHTML = `
      <tr>
        <td colspan="8">
          No enquiries yet.
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML =
    enquiries.data.map(item => {


      const date =
        item.created_at
          ? new Date(
              item.created_at
            ).toLocaleString()
          : "";


      const phone =
        item.phone || "";


      const whatsappNumber =
        phone.replace(/\D/g,"");


      return `

        <tr>

          <td>
            ${escapeHTML(item.name || "")}
          </td>

          <td>
            ${escapeHTML(item.phone || "")}
          </td>

          <td>
            ${escapeHTML(item.email || "")}
          </td>

          <td>
            ${escapeHTML(item.location || "")}
          </td>

          <td>
            ${escapeHTML(item.message || "")}
          </td>

          <td>
            ${escapeHTML(item.status || "new")}
          </td>

          <td>
            ${escapeHTML(date)}
          </td>

          <td>

            ${
              whatsappNumber
              ?
              `<a
                href="https://wa.me/${whatsappNumber}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                  display:inline-block;
                  margin:3px;
                  padding:7px 10px;
                  background:#25D366;
                  color:white;
                  border-radius:7px;
                  text-decoration:none;
                  font-weight:bold;
                "
              >
                WhatsApp
              </a>`
              :
              ""
            }


            ${
              phone
              ?
              `<a
                href="tel:${encodeURIComponent(phone)}"
                style="
                  display:inline-block;
                  margin:3px;
                  padding:7px 10px;
                  background:#3d2b21;
                  color:white;
                  border-radius:7px;
                  text-decoration:none;
                  font-weight:bold;
                "
              >
                Call
              </a>`
              :
              ""
            }

          </td>

        </tr>

      `;

    }).join("");

}


/* SAFE TEXT */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* SAVE SITE CONTENT */

async function saveSiteContent(){

  const section =
    document
      .getElementById("contentTitle")
      .value
      .trim();


  const text =
    document
      .getElementById("contentText")
      .value
      .trim();


  const message =
    document.getElementById(
      "contentMessage"
    );


  if(!section || !text){

    message.className="error";

    message.textContent =
      "Please enter both section and content.";

    return;
  }


  message.className="";
  message.textContent="Saving...";


  const {error} =
    await db
      .from("site_content")
      .insert({

        section:section,

        content:{
          text:text
        }

      });


  if(error){

    message.className="error";

    message.textContent =
      "Error: " + error.message;

    return;
  }


  message.className="success";

  message.textContent =
    "Site content saved successfully!";


  document.getElementById(
    "contentTitle"
  ).value="";


  document.getElementById(
    "contentText"
  ).value="";


  loadData();

}


/* SAVE MENU ITEM */

async function saveMenuItem(){

  const name =
    document
      .getElementById("menuName")
      .value
      .trim();


  const price =
    document.getElementById(
      "menuPrice"
    ).value;


  const description =
    document
      .getElementById("menuDescription")
      .value
      .trim();


  const message =
    document.getElementById(
      "menuMessage"
    );


  if(!name || !price){

    message.className="error";

    message.textContent =
      "Please enter name and price.";

    return;
  }


  message.className="";
  message.textContent="Saving...";


  const {error} =
    await db
      .from("menu_items")
      .insert({

        name:name,

        price:Number(price),

        description:description

      });


  if(error){

    message.className="error";

    message.textContent =
      "Error: " + error.message;

    return;
  }


  message.className="success";

  message.textContent =
    "Menu item saved successfully!";


  document.getElementById(
    "menuName"
  ).value="";


  document.getElementById(
    "menuPrice"
  ).value="";


  document.getElementById(
    "menuDescription"
  ).value="";


  loadData();

}


/* SAVE GALLERY */

async function saveGallery(){

  const imageUrl =
    document
      .getElementById("galleryImage")
      .value
      .trim();


  const title =
    document
      .getElementById("galleryTitle")
      .value
      .trim();


  const message =
    document.getElementById(
      "galleryMessage"
    );


  if(!imageUrl){

    message.className="error";

    message.textContent =
      "Please enter an image URL.";

    return;
  }


  message.className="";
  message.textContent="Saving...";


  const {error} =
    await db
      .from("gallery")
      .insert({

        title:title,

        image_url:imageUrl,

        display_order:0,

        is_active:true

      });


  if(error){

    message.className="error";

    message.textContent =
      "Error: " + error.message;

    return;
  }


  message.className="success";

  message.textContent =
    "Gallery image saved successfully!";


  document.getElementById(
    "galleryImage"
  ).value="";


  document.getElementById(
    "galleryTitle"
  ).value="";


  loadData();

}


/* SAVE REVIEW */

async function saveReview(){

  const customerName =
    document
      .getElementById("customerName")
      .value
      .trim();


  const reviewText =
    document
      .getElementById("reviewText")
      .value
      .trim();


  const rating =
    document.getElementById(
      "reviewRating"
    ).value;


  const message =
    document.getElementById(
      "reviewMessage"
    );


  if(
    !customerName ||
    !reviewText ||
    !rating
  ){

    message.className="error";

    message.textContent =
      "Please enter customer name, review and rating.";

    return;
  }


  message.className="";
  message.textContent="Saving...";


  const {error} =
    await db
      .from("reviews")
      .insert({

        customer_name:customerName,

        review_text:reviewText,

        rating:Number(rating),

        is_active:true

      });


  if(error){

    message.className="error";

    message.textContent =
      "Error: " + error.message;

    return;
  }


  message.className="success";

  message.textContent =
    "Review saved successfully!";


  document.getElementById(
    "customerName"
  ).value="";


  document.getElementById(
    "reviewText"
  ).value="";


  document.getElementById(
    "reviewRating"
  ).value="";


  loadData();

}


/* LOGOUT */

async function logout(){

  await db.auth.signOut();

  window.location.href="admin.html";

}


/* START */

checkLogin();

</script>

</body>
</html>
