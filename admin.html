<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sree's Waffle Galaxy - Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f6f4e8;
  color:#3d2b21;
  font-family:Arial,sans-serif;
}
.login{
  width:min(420px,90%);
  background:#fffdf8;
  padding:35px;
  border-radius:25px;
  box-shadow:0 18px 55px rgba(61,43,33,.15);
}
h1{margin-top:0;text-align:center}
p{text-align:center;color:#76665d}
label{display:block;margin:15px 0 6px;font-weight:bold;font-size:14px}
input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:999px;
  background:#3d2b21;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9}
#message{
  margin-top:15px;
  color:#9d5b5b;
  text-align:center;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login">
  <h1>Sree's Waffle Galaxy</h1>
  <p>Admin Login</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" required>

    <label for="password">Password</label>
    <input id="password" type="password" required>

    <button type="submit">Login</button>

    <div id="message"></div>
  </form>
</div>

<script>
const SUPABASE_URL = "https://vxcbpbcqiqwgiapgvoxy.supabase.co";
const SUPABASE_KEY = "sb_publishable_sSh0vTRY28VnBKP8Zunosg_07RmB9BJ";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Logging in...";

  const { data, error } = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    message.textContent = error.message;
    return;
  }

  message.style.color = "#2e7d32";
  message.textContent = "Login successful!";

  setTimeout(() => {
    window.location.href = "admin-dashboard.html";
  }, 800);
});
</script>

</body>
</html>
