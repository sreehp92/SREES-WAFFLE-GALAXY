<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sree's Waffle Galaxy - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f4e8;
  color:#3d2b21;
  font-family:Arial,sans-serif
}

header{
  background:#3d2b21;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}

header h1{
  margin:0;
  font-size:20px
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
  background:#3d2b21;
  color:white;
  margin-top:8px
}

button:hover{
  opacity:.9
}

.logout{
  background:#dc9b9b;
  color:#3d2b21
}

.edit-btn{
  background:#4f7cac;
  margin-right:5px
}

.delete-btn{
  background:#b3261e
}

main{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px
}

.card{
  background:#fffdf8;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(61,43,33,.1)
}

h2{
  margin-top:0
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  font-size:14px
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit
}

textarea{
  min-height:120px;
  resize:vertical
}

.message{
  padding:12px;
  background:#e5eee4;
  border-radius:10px;
  margin-bottom:20px;
  font-weight:bold
}

.success{
  color:#287a3d;
  font-weight:bold
}

.error{
  color:#b3261e;
  font-weight:bold
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#f6f4e8;
  padding:15px;
  border-radius:10px
}

hr{
  border:0;
  border-top:1px solid #ddd;
  margin:20px 0
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
  vertical-align:top;
  font-size:14px
}

th{
  background:#f6f4e8;
  font-weight:bold
}

.action-buttons{
  white-space:nowrap
}

@media(max-width:600px){

  header{
    padding:15px;
  }

  header h1{
    font-size:16px;
  }

  main{
    margin:20px auto;
    padding:0 10px;
  }

  .card{
    padding:16px;
    border-radius:14px;
  }

  h2{
    font-size:20px;
  }

  input,
  textarea,
  select{
    font-size:16px;
  }

  table{
    min-width:900px;
  }

}
</style>

<script type="module">
  import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@2/dist/index.mjs';
  injectSpeedInsights();
</script>
</head>

<header>

<main>

<div id="message" class="message">Loading...</div>

<!-- SITE CONTENT -->

<input
id="contentTitle"
type="text"
placeholder="Example: About">

<button onclick="saveSiteContent()">

<button
id="cancelContentEdit"
onclick="cancelContentEdit()"
style="display:none;background:#777"

Cancel Edit </button>

<!-- MENU ITEMS -->

id="menuName"

<script>


/* SUPABASE */

const SUPABASE_URL =
"https://vxcbpbcqiqwgiapgvoxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_sSh0vTRY28VnBKP8Zunosg_07RmB9BJ";

const {createClient} = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* EDIT IDS */

let editingSiteId = null;
let editingMenuId = null;
let editingGalleryId = null;
let editingReviewId = null;


/* LOGIN CHECK */

async function checkLogin(){

  const {
    data:{user}
  } = await db.auth.getUser();

  if(!user){

    window.location.href="admin.html";

    return;
  }

  document.getElementById("message").textContent =
    "Logged in as " + user.email;

  loadData();
}


/* LOAD ALL DATA */

async function loadData(){

  await loadSiteContent();
  await loadMenuItems();
  await loadGallery();
  await loadReviews();
  await loadEnquiries();

}


/* LOAD SITE CONTENT */

async function loadSiteContent(){

  const {data,error} =
    await db
      .from("site_content")
      .select("*")
      .order("id",{ascending:true});

  const box =
    document.getElementById("siteContentList");

  if(error){

    box.innerHTML =
      `<p class="error">${escapeHTML(error.message)}</p>`;

    return;
  }

  if(!data || data.length === 0){

    box.innerHTML =
      "<p>No site content yet.</p>";

    return;
  }

  box.innerHTML = data.map(item => `

    <div style="
      background:#f6f4e8;
      padding:15px;
      border-radius:10px;
      margin-bottom:10px;
    ">

      <strong>
        ${escapeHTML(item.section || "")}
      </strong>

      <p>
        ${escapeHTML(
          item.content?.text || ""
        )}
      </p>

      <button
        class="edit-btn"
        onclick="editSiteContent(${item.id})"
      >
        Edit
      </button>

      <button
        class="delete-btn"
        onclick="deleteSiteContent(${item.id})"
      >
        Delete
      </button>

    </div>

  `).join("");

}


/* EDIT SITE CONTENT */

async function editSiteContent(id){

  const {data,error} =
    await db
      .from("site_content")
      .select("*")
      .eq("id",id)
      .single();

  if(error){

    alert(error.message);

    return;
  }

  editingSiteId = id;

  document.getElementById("contentTitle").value =
    data.section || "";

  document.getElementById("contentText").value =
    data.content?.text || "";

  document.getElementById(
    "cancelContentEdit"
  ).style.display="inline-block";

  document.getElementById(
    "contentMessage"
  ).textContent =
    "Editing site content...";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* DELETE SITE CONTENT */

async function deleteSiteContent(id){

  if(!confirm(
    "Delete this site content?"
  )) return;

  const {error} =
    await db
      .from("site_content")
      .delete()
      .eq("id",id);

  if(error){

    alert(error.message);

    return;
  }

  loadData();

}


/* CANCEL SITE EDIT */

function cancelContentEdit(){

  editingSiteId = null;

  document.getElementById(
    "contentTitle"
  ).value="";

  document.getElementById(
    "contentText"
  ).value="";

  document.getElementById(
    "cancelContentEdit"
  ).style.display="none";

  document.getElementById(
    "contentMessage"
  ).textContent="";

}


/* SAVE SITE CONTENT */

async function saveSiteContent(){

  const section =
    document
      .getElementById("contentTitle")
      .value
      .trim();

  const text =
    document
      .getElementById("contentText")
      .value
      .trim();

  const message =
    document.getElementById(
      "contentMessage"
    );


  if(!section || !text){

    message.className="error";

    message.textContent =
      "Please enter both section and content.";

    return;
  }


  message.className="";
  message.textContent="Saving...";


  let result;


  if(editingSiteId){

    result =
      await db
        .from("site_content")
        .update({

          section:section,

          content:{
            text:text
          }

        })
        .eq("id",editingSiteId);

  }else{

    result =
      await db
        .from("site_content")
        .insert({

          section:section,

          content:{
            text:text
          }

        });

  }


  if(result.error){

    message.className="error";

    message.textContent =
      "Error: " + result.error.message;

    return;
  }


  message.className="success";

  message.textContent =
    editingSiteId
      ? "Site content updated successfully!"
      : "Site content saved successfully!";


  cancelContentEdit();

  loadData();

}


/* LOAD MENU ITEMS */

}

      await db
        .from("menu_items")
        .update({

          name:name,

          price:Number(price),

          description:description

        })

  }else{

    result =
      await db
        .from("menu_items")

          name:name,

          price:Number(price),

          description:description

        });

  }


  if(result.error){

    message.className="error";

    message.textContent =
      "Error: " + result.error.message;

    return;
  }


  message.className="success";

}

    );


  if(

  ){

    return;
  }


  message.className="";
  message.textContent="Saving...";


  let result;


  if(editingReviewId){

    result =
      await db
        .from("reviews")
        .update({

          customer_name:customerName,

          review_text:reviewText,

          rating:Number(rating)

        })
        .eq("id",editingReviewId);

  }else{

    result =
      await db
        .from("reviews")
        .insert({

          customer_name:customerName,

          review_text:reviewText,

          rating:Number(rating),

          is_active:true

        });

  }


  if(result.error){

    message.className="error";

    message.textContent =
      "Error: " + result.error.message;

    return;
  }


  message.className="success";

  message.textContent =
    editingReviewId
      ? "Review updated successfully!"
      : "Review saved successfully!";


  cancelReviewEdit();

  loadData();

}


/* LOAD ENQUIRIES */

async function loadEnquiries(){

  const {data,error} =
    await db
      .from("enquiries")
      .select("*")
      .order("id",{ascending:false});


  const tbody =
    document.getElementById(
      "enquiries"
    );


  if(error){

    tbody.innerHTML = `
      <tr>
        <td colspan="8">
          Error loading enquiries:
          ${escapeHTML(error.message)}
        </td>
      </tr>
    `;

    return;
  }


  if(!data || data.length===0){

    tbody.innerHTML = `
      <tr>
        <td colspan="8">
          No enquiries yet.
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML =
    data.map(item => {

      const date =
        item.created_at
          ? new Date(
              item.created_at
            ).toLocaleString()
          : "";


      const phone =
        item.phone || "";


      const whatsappNumber =
        phone.replace(/\D/g,"");


      return `

        <tr>

          <td>
            ${escapeHTML(item.name || "")}
          </td>

          <td>
            ${escapeHTML(item.phone || "")}
          </td>

          <td>
            ${escapeHTML(item.email || "")}
          </td>

          <td>
            ${escapeHTML(item.location || "")}
          </td>

          <td>
            ${escapeHTML(item.message || "")}
          </td>

          <td>
            ${escapeHTML(item.status || "new")}
          </td>

          <td>
            ${escapeHTML(date)}
          </td>

          <td class="action-buttons">

            ${
              whatsappNumber
              ?
              `<a
                href="https://wa.me/${whatsappNumber}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                  display:inline-block;
                  margin:3px;
                  padding:7px 10px;
                  background:#25D366;
                  color:white;
                  border-radius:7px;
                  text-decoration:none;
                  font-weight:bold;
                "
              >
                WhatsApp
              </a>`
              :
              ""
            }


            ${
              phone
              ?
              `<a
                href="tel:${encodeURIComponent(phone)}"
                style="
                  display:inline-block;
                  margin:3px;
                  padding:7px 10px;
                  background:#3d2b21;
                  color:white;
                  border-radius:7px;
                  text-decoration:none;
                  font-weight:bold;
                "
              >
                Call
              </a>`
              :
              ""
            }

          </td>

        </tr>

      `;

    }).join("");

}


/* SAFE TEXT */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* LOGOUT */

async function logout(){

  await db.auth.signOut();

  window.location.href="admin.html";

}
